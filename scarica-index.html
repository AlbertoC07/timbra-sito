<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scarica Timbra</title>
<meta name="description" content="Timbra — le tessere fedeltà digitali del tuo quartiere.">
<meta name="robots" content="noindex">

<!-- ====================================================================
     UNICA COSA DA MODIFICARE: il blocco qui sotto.

     Ogni piattaforma si accende per conto suo.
       attivoIos / attivoAndroid = false → "in arrivo" per quel telefono
       attivoIos / attivoAndroid = true  → bottone verso lo store

     I due link sono già quelli veri. Quando Timbra esce su Google Play
     basta cambiare attivoAndroid da false a true: i cartellini già
     stampati continuano a funzionare, non si ristampa niente.
     ==================================================================== -->
<script>
  const CONFIG = {
    // Si accendono una alla volta: iOS è pubblicata, Android no.
    // Quando esce anche su Google Play, metti attivoAndroid: true.
    attivoIos: true,
    attivoAndroid: false,

    ios: "https://apps.apple.com/it/app/timbra-tessere-fedelt%C3%A0/id6819847694",
    android: "https://play.google.com/store/apps/details?id=com.timbraapp.timbra",
  };
</script>

<style>
  :root {
    --crema: #FFFFFF;
    --inchiostro: #1A1715;
    --grigio: #6B625B;
    --rosso: #C0261F;
    --rosso-scuro: #9E1F19;
    --linea: #E4DBD3;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100svh;
    background: var(--crema);
    color: var(--inchiostro);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
    text-align: center;
  }

  main { width: 100%; max-width: 420px; }

  .logo { width: 172px; height: auto; margin-bottom: 34px; }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 10px;
  }

  .occhiello {
    font-size: 16px;
    color: var(--grigio);
    margin: 0 0 32px;
  }

  .bottone {
    display: block;
    width: 100%;
    padding: 18px 20px;
    border: none;
    border-radius: 14px;
    background: var(--rosso);
    color: #fff;
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--rosso-scuro);
  }

  .bottone:active { transform: translateY(1px); box-shadow: none; }

  .bottone + .bottone { margin-top: 12px; }

  .bottone.secondario {
    background: #fff;
    color: var(--inchiostro);
    border: 1px solid var(--linea);
    box-shadow: none;
  }

  .attesa {
    background: #fff;
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 22px 20px;
  }

  .attesa strong { display: block; font-size: 19px; margin-bottom: 6px; }
  .attesa span { color: var(--grigio); font-size: 15px; }

  .come {
    margin-top: 34px;
    padding-top: 26px;
    border-top: 1px solid var(--linea);
    text-align: left;
  }

  .come h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9A8F86;
    margin: 0 0 14px;
  }

  .come ol { margin: 0; padding-left: 20px; color: var(--grigio); font-size: 15px; }
  .come li { margin-bottom: 7px; }
  .come li:last-child { margin-bottom: 0; }

  footer {
    margin-top: 30px;
    font-size: 13px;
    color: #9A8F86;
  }

  footer a { color: inherit; }

  /* Sfondo sempre bianco, anche su un telefono in modalita' scura:
     il cartellino al banco e' bianco e la pagina deve essergli uguale. */
  :root { color-scheme: light; }
</style>
</head>

  <h1>La tua tessera fedeltà<br>è sul telefono</h1>
  <p class="occhiello">Niente cartoncini da perdere. I timbri restano qui.</p>

  <div id="azione"></div>

  <section class="come">
    <h2>Come funziona</h2>
    <ol>
      <li>Scarichi l'app e ti registri in mezzo minuto.</li>
      <li>Mostri il tuo codice alla cassa e ricevi il timbro.</li>
      <li>Completi la tessera e ritiri il premio.</li>
    </ol>
  </section>

  <footer>
    <a href="https://apptimbra.com">apptimbra.com</a>
  </footer>
</main>

<script>
(function () {
  const ua = navigator.userAgent || "";
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);

  const box = document.getElementById("azione");

  const bottone = (testo, href, secondario) =>
    '<a class="bottone' + (secondario ? ' secondario' : '') + '" href="' +
    href + '">' + testo + '</a>';

  const attesa = (testo) =>
    '<div class="attesa"><strong>Disponibile fra pochi giorni</strong>' +
    '<span>' + testo + '</span></div>';

  if (iOS) {
    box.innerHTML = CONFIG.attivoIos
      ? bottone("Scarica per iPhone", CONFIG.ios)
      : attesa("Stiamo pubblicando l\'app su App Store. Chiedi alla cassa e ti avvisano appena c\'è.");
  } else if (android) {
    box.innerHTML = CONFIG.attivoAndroid
      ? bottone("Scarica per Android", CONFIG.android)
      : attesa("Su iPhone Timbra c\'è già. Per Android manca pochissimo: chiedi alla cassa e ti avvisano appena esce.");
  } else {
    // da computer: mostriamo solo quello che esiste davvero
    let html = "";
    if (CONFIG.attivoIos) html += bottone("Scarica per iPhone", CONFIG.ios);
    if (CONFIG.attivoAndroid) html += bottone("Scarica per Android", CONFIG.android, Boolean(html));
    box.innerHTML = html || attesa("Stiamo pubblicando l\'app sugli store.");
  }
})();
</script>

</body>
</html>
